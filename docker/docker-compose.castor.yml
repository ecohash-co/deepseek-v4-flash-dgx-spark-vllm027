# vLLM 0.27.1 TRIAL — separate from docker-compose.dspark.yml (the working stack).
# Differences from the 0.21+overlay stack, all deliberate:
#   * image: official arm64 vllm/vllm-openai:v0.27.1 (no Caricio overlay, no Keys patch)
#   * NO Patch 4 bind-mount   -> upstream path differs; a bind-mount would create a DIRECTORY
#   * --kv-cache-dtype fp8_ds_mla  (nvfp4_ds_mla does not exist upstream; identical 584B layout)
#   * paths: /usr/local/... not /opt/env/... ; entrypoint overridden
#   * VLLM_CACHE_ROOT isolated so we do not poison the working stack's compile/autotune cache
#   * restart: "no" -- this is a trial; do not let it flap
services:
  vllm027:
    container_name: vllm027
    restart: unless-stopped
    image: vllm027-gb10:patched
    network_mode: host
    ipc: host
    shm_size: "64gb"
    ulimits:
      memlock: -1
      stack: 67108864
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      # patches are BAKED into vllm027-gb10:patched (were 2 :ro bind-mounts here until 2026-08-11)
      - ${HOME}/.cache/huggingface:/cache/huggingface
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "0"
      HF_HUB_DISABLE_XET: "1"
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache-027
      VLLM_HOST_IP: "192.168.100.10"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      NCCL_NET: "IB"
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "rocep1s0f0"
      NCCL_SOCKET_IFNAME: "enp1s0f0np0"
      NCCL_IB_GID_INDEX: "3"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: "WARN"
      NCCL_NVLS_ENABLE: "0"
      MN_IF_NAME: "enP7s7"
      GLOO_SOCKET_IFNAME: "enP7s7"
      TP_SOCKET_IFNAME: "enP7s7"
      OMPI_MCA_btl_tcp_if_include: "enP7s7"
      OMP_NUM_THREADS: "4"
      MASTER_ADDR: "192.168.100.10"
      MASTER_PORT: "25000"
      NODE_RANK: "0"
    entrypoint: ["bash", "-lc"]
    command:
      - >
        exec vllm serve deepseek-ai/DeepSeek-V4-Flash-0731
        --served-model-name deepseek-v4-flash-dspark
        --host 0.0.0.0
        --port 8888
        --trust-remote-code
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --kv-cache-dtype fp8_ds_mla
        --block-size 256
        --max-model-len 1048576
        --max-num-seqs 12
        --max-num-batched-tokens 8192
        --max-cudagraph-capture-size 72
        --gpu-memory-utilization 0.80
        --enable-prefix-caching
        --async-scheduling
        --enable-chunked-prefill
        --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}'
        --tokenizer-mode deepseek_v4
        --distributed-executor-backend mp
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --default-chat-template-kwargs '{"thinking":true}'
        --generation-config vllm
        --enable-flashinfer-autotune
        --nnodes 2
        --node-rank 0
        --master-addr 192.168.100.10
        --master-port 25000
        
